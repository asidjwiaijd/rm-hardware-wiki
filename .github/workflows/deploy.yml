name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 连续合并时排队执行，避免后完成的旧构建覆盖新构建
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "只有 main 分支能触发部署。"
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # "最后更新时间""贡献者""最近更新"都要读 git 日志，必须拉全量历史
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          # 供 helpers/contributors.ts 调 GitHub API 拉贡献者头像
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
